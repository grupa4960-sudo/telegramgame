<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slot Bomb - Lightning Edition</title>
    <style>
        body { 
            font-family: 'Segoe UI', Roboto, sans-serif; 
            text-align: center; color: white; margin: 0; padding: 20px;
            background: #0a0a0a; overflow: hidden;
        }
        #lightningCanvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; pointer-events: none; }
        .header { margin-top: 10px; position: relative; z-index: 1; }
        h1 { color: #f1c40f; text-shadow: 0 0 15px rgba(241, 196, 15, 0.4); margin-bottom: 5px; }
        .multiplier { font-size: 42px; color: #2ecc71; font-weight: bold; }
        .status-win { color: #f1c40f !important; font-size: 24px !important; text-shadow: 0 0 20px gold; animation: pulse 1s infinite; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }
        
        .grid { display: grid; gap: 10px; justify-content: center; margin: 20px auto; position: relative; z-index: 1; }
        .cell { 
            width: 75px; height: 75px; background: rgba(30, 30, 50, 0.9);
            display: flex; align-items: center; justify-content: center; 
            font-size: 30px; cursor: pointer; border-radius: 12px; 
            border: 1px solid rgba(255,255,255,0.1); backdrop-filter: blur(5px); transition: 0.2s;
            position: relative;
        }
        /* Menampilkan nomor kecil di pojok sebagai panduan admin */
        .cell::after {
            content: attr(data-index);
            position: absolute; top: 5px; left: 5px; font-size: 10px; color: rgba(255,255,255,0.2);
        }
        .cell.open { cursor: default; }
        .cell.safe { background: rgba(46, 204, 113, 0.8) !important; box-shadow: 0 0 15px #2ecc71; }
        .cell.bomb { background: rgba(231, 76, 60, 0.8) !important; box-shadow: 0 0 15px #e74c3c; }
        
        .controls { margin-top: 20px; position: relative; z-index: 1; min-height: 80px;}
        .btn-end { display: none; padding: 15px 40px; font-size: 18px; font-weight: bold; text-decoration: none; border-radius: 50px; color: white; box-shadow: 0 5px 15px rgba(0,0,0,0.5); }
        .btn-claim { background: linear-gradient(180deg, #f1c40f, #e67e22); color: black; }
        .btn-back { background: #34495e; }

        #ticketOverlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.95); display: flex; align-items: center; justify-content: center; z-index: 9999; }
        .ticket-box { background: #1a1a1a; padding: 30px; border-radius: 20px; border: 2px solid #f1c40f; width: 280px; box-shadow: 0 0 30px rgba(241, 196, 15, 0.2); }
        .ticket-box input { width: 90%; padding: 12px; margin: 8px 0; border-radius: 8px; text-align: center; font-size: 16px; border: 1px solid #333; background: white; color: black; }
    </style>
</head>
<body>

<canvas id="lightningCanvas"></canvas>

<div id="ticketOverlay">
    <div class="ticket-box">
        <h2 style="color: #f1c40f;">🎟️ LOGIN PLAYER</h2>
        <input type="text" id="userNameInput" placeholder="Masukkan Nama">
        <input type="text" id="ticketInput" placeholder="Masukkan Kode Tiket">
        <button id="btnVerify" onclick="verifyTicket()" style="width:100%; padding:14px; background:#f1c40f; font-weight:bold; border:none; border-radius:8px; cursor:pointer; margin-top:10px; color: black;">MULAI MAIN</button>
        <p id="ticketError" style="color:#ff4d4d; display:none; margin-top:12px; font-size: 14px; font-weight: bold;"></p>
    </div>
</div>

<div class="header">
    <h1>💎 SLOT BOMB 💣</h1>
    <div class="multiplier" id="multiDisplay">x1.00</div>
    <p id="status">Cari Diamond!</p>
</div>

<div class="grid" id="grid"></div>

<div class="controls">
    <a href="https://t.me/Link_Klaim" id="btnWin" class="btn-end btn-claim">KLAIM HADIAH</a>
    <a href="https://t.me/Link_Kembali" id="btnLose" class="btn-end btn-back">KEMBALI</a>
    <p onclick="location.reload()" style="cursor:pointer; font-size:11px; margin-top:30px; color:#555; text-decoration: underline;">Reset Sesi</p>
</div>

<script>
    const CONFIG = {
        cols: 3, rows: 3, bombsCount: 1, profitRate: 1.25,
        // MASUKKAN URL WEB APP GOOGLE SCRIPT ANDA DI SINI
        scriptUrl: "https://script.google.com/macros/s/AKfycbzncmHnLw90icjI2_wuUqIqbhomnC9oIQAILbjOPIq03HfbNnuNNde8JEtcYg5Z0WvAgw/exec", 
        sheetNameTarget: "KODE TIKET 6" 
    };

    let currentTicket = "", currentName = "", bombPositions = [], isGameOver = false, revealedCount = 0;

    async function getIp() {
        try {
            const res = await fetch('https://api.ipify.org?format=json');
            const data = await res.json();
            return data.ip;
        } catch (e) { return "IP Hidden"; }
    }

    async function verifyTicket() {
        const nameIn = document.getElementById('userNameInput').value.trim();
        const ticketIn = document.getElementById('ticketInput').value.trim();
        const errorEl = document.getElementById('ticketError');
        const btn = document.getElementById('btnVerify');

        if (!nameIn || !ticketIn) {
            errorEl.innerText = "Data tidak lengkap!";
            errorEl.style.display = 'block';
            return;
        }

        btn.disabled = true; btn.innerText = "MENGECEK...";
        currentTicket = ticketIn; currentName = nameIn;
        const userIp = await getIp();

        try {
            const url = `${CONFIG.scriptUrl}?ticket=${encodeURIComponent(ticketIn)}&userName=${encodeURIComponent(nameIn)}&sheetName=${encodeURIComponent(CONFIG.sheetNameTarget)}&action=verify&ip=${userIp}`;
            const res = await fetch(url);
            const result = await res.text();

            if (result.trim() === "VALID") {
                document.getElementById('ticketOverlay').style.display = 'none';
                initGame();
            } else {
                errorEl.innerText = result === "USED" ? "TIKET SUDAH DIGUNAKAN!" : "TIKET TIDAK TERDAFTAR!";
                errorEl.style.display = 'block';
                btn.disabled = false; btn.innerText = "MULAI MAIN";
            }
        } catch (e) { 
            errorEl.innerText = "ERROR KONEKSI!"; errorEl.style.display = 'block';
            btn.disabled = false;
        }
    }

    async function updateGameResult(status) {
        const userIp = await getIp();
        // Logika Lokasi Bom (1-9) sesuai permintaan
        const bombLocs = bombPositions.map(p => p + 1).join(", ");
        const reportLabel = `kolom nomor ${bombLocs}`;
        
        const url = `${CONFIG.scriptUrl}?ticket=${encodeURIComponent(currentTicket)}&userName=${encodeURIComponent(currentName)}&action=${status}&ip=${userIp}&sheetName=${encodeURIComponent(CONFIG.sheetNameTarget)}&bombs=${encodeURIComponent(reportLabel)}`;
        
        fetch(url, { mode: 'no-cors', keepalive: true });
    }

    function initGame() {
        const gridEl = document.getElementById('grid');
        const total = CONFIG.cols * CONFIG.rows;
        bombPositions = []; isGameOver = false; revealedCount = 0;
        
        gridEl.style.gridTemplateColumns = `repeat(${CONFIG.cols}, 75px)`;
        gridEl.innerHTML = '';

        while(bombPositions.length < CONFIG.bombsCount) {
            let r = Math.floor(Math.random() * total);
            if(!bombPositions.includes(r)) bombPositions.push(r);
        }

        for (let i = 0; i < total; i++) {
            const cell = document.createElement('div');
            cell.classList.add('cell');
            cell.setAttribute('data-index', i + 1); // Penomoran 1-9
            cell.onclick = () => handleTap(i, cell);
            gridEl.appendChild(cell);
        }
    }

    async function handleTap(idx, el) {
        if (isGameOver || el.classList.contains('open')) return;
        el.classList.add('open');

        if (bombPositions.includes(idx)) {
            isGameOver = true;
            el.innerText = '💣'; el.classList.add('bomb');
            document.getElementById('status').innerText = "BOOM! ANDA KALAH";
            document.getElementById('btnLose').style.display = 'inline-block';
            revealAll();
            await updateGameResult("lose");
        } else {
            revealedCount++;
            let multi = Math.pow(CONFIG.profitRate, revealedCount);
            el.innerText = '💎'; el.classList.add('safe');
            document.getElementById('multiDisplay').innerText = `x${multi.toFixed(2)}`;
            
            const totalSafe = (CONFIG.cols * CONFIG.rows) - CONFIG.bombsCount;
            if (revealedCount === totalSafe) {
                isGameOver = true;
                document.getElementById('status').innerText = "YOU WIN!";
                document.getElementById('status').classList.add('status-win');
                document.getElementById('btnWin').style.display = 'inline-block';
                await updateGameResult("win");
            }
        }
    }

    function revealAll() {
        const cells = document.querySelectorAll('.cell');
        bombPositions.forEach(p => {
            cells[p].innerText = '💣';
            cells[p].classList.add('bomb');
        });
    }

    // --- ANIMASI LIGHTNING (Tetap) ---
    const canvas = document.getElementById('lightningCanvas');
    const ctx = canvas.getContext('2d');
    let w, h;
    function resize() { w = canvas.width = window.innerWidth; h = canvas.height = window.innerHeight; }
    window.addEventListener('resize', resize);
    resize();
    class Lightning {
        constructor() { this.reset(); }
        reset() {
            this.x = Math.random() * w; this.y = 0;
            this.path = [{x: this.x, y: 0}];
            this.alpha = Math.random() * 0.5 + 0.3;
            this.finished = false;
            let curX = this.x, curY = 0;
            while (curY < h) {
                curX += (Math.random() - 0.5) * 40; curY += Math.random() * 20 + 10;
                this.path.push({x: curX, y: curY});
            }
        }
        draw() {
            ctx.strokeStyle = `rgba(180, 220, 255, ${this.alpha})`;
            ctx.lineWidth = 2; ctx.beginPath();
            ctx.moveTo(this.path[0].x, this.path[0].y);
            for (let i = 1; i < this.path.length; i++) ctx.lineTo(this.path[i].x, this.path[i].y);
            ctx.stroke();
            this.alpha -= 0.04; if (this.alpha <= 0) this.finished = true;
        }
    }
    let lightnings = [];
    function animate() {
        ctx.fillStyle = 'rgba(10, 10, 10, 0.2)'; ctx.fillRect(0, 0, w, h);
        if (Math.random() < 0.04) lightnings.push(new Lightning());
        lightnings.forEach((l, i) => { l.draw(); if (l.finished) lightnings.splice(i, 1); });
        requestAnimationFrame(animate);
    }
    animate();
</script>
</body>
</html>
