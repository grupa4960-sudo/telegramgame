<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slot Bomb Tactics - Telegram Ticket</title>
    <style>
        body { 
            font-family: 'Segoe UI', Roboto, sans-serif; 
            text-align: center; 
            background: #0f0f1b; 
            color: white; 
            margin: 0; padding: 20px;
        }

        /* HEADER & MULTIPLIER */
        .header { margin-bottom: 20px; }
        h1 { color: #f1c40f; margin-bottom: 5px; }
        .multiplier { font-size: 32px; color: #2ecc71; font-weight: bold; margin: 10px 0; }
        #status { color: #bdc3c7; height: 20px; }

        /* GRID */
        .grid { display: grid; gap: 8px; justify-content: center; margin: 25px auto; }
        .cell { 
            width: 60px; height: 60px; background: #23233a; 
            display: flex; align-items: center; justify-content: center; 
            font-size: 24px; cursor: pointer; border-radius: 10px; border: 1px solid #34495e;
            transition: 0.2s;
        }
        .cell.open { cursor: default; }
        .cell.safe { background: #2ecc71 !important; border-color: #27ae60; }
        .cell.bomb { background: #ff4d4d !important; border-color: #b33939; }

        /* OVERLAY TIKET */
        #ticketOverlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(10, 10, 20, 0.98);
            display: flex; align-items: center; justify-content: center; z-index: 9999;
        }
        .ticket-box { background: #1a1a2e; padding: 30px; border-radius: 20px; border: 2px solid #f1c40f; width: 80%; max-width: 300px; }
        .ticket-box input { width: 100%; padding: 12px; margin: 15px 0; border-radius: 8px; border: 1px solid #34495e; background: #0f0f1b; color: #f1c40f; font-size: 18px; text-align: center; box-sizing: border-box; }

        /* TOMBOL AKHIR */
        .controls { margin-top: 30px; min-height: 80px; }
        .btn-end { 
            display: none; padding: 15px 35px; font-size: 18px; font-weight: bold; 
            text-decoration: none; border-radius: 50px; color: white; transition: 0.3s;
            animation: pulse 1.5s infinite;
        }
        .btn-claim { background: linear-gradient(180deg, #f1c40f, #e67e22); box-shadow: 0 5px 15px rgba(230, 126, 34, 0.4); }
        .btn-back { background: linear-gradient(180deg, #7f8c8d, #34495e); box-shadow: 0 5px 15px rgba(0,0,0,0.3); }

        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }
        .reset-text { display: block; margin-top: 20px; color: #555; cursor: pointer; font-size: 12px; }
    </style>
</head>
<body>

    <div id="ticketOverlay">
        <div class="ticket-box">
            <h2>🎟️ AKSES TIKET</h2>
            <input type="text" id="ticketInput" placeholder="MASUKKAN KODE">
            <button onclick="verifyTicket()" style="width:100%; padding:12px; background:#f1c40f; border:none; border-radius:8px; font-weight:bold; cursor:pointer;">MULAI MAIN</button>
            <p id="ticketError" style="color:#ff4d4d; display:none; font-size:12px; margin-top:10px;">Tiket Salah!</p>
        </div>
    </div>

    <div class="header">
        <h1>💎 SLOT BOMB 💣</h1>
        <div class="multiplier" id="multiDisplay">x1.00</div>
        <p id="status">Cari Diamond untuk Klaim Hadiah!</p>
    </div>

    <div class="grid" id="grid"></div>

    <div class="controls">
        <a href="https://t.me/saranggenz" id="btnWin" class="btn-end btn-claim">KLAIM HADIAH</a>
        
        <a href="https://t.me/RuangTemukuu" id="btnLose" class="btn-end btn-back">KEMBALI</a>

        <span class="reset-text" onclick="location.reload()">Reset Sesi Tiket</span>
    </div>

    <script>
        // --- KONFIGURASI ---
        const CONFIG = {
            cols: 3, 
            rows: 3, 
            bombs: 1, 
            validTickets: ["VIP77", "GOLD99"],
            profitRate: 1.25
        };

        let bombPositions = [];
        let isGameOver = false;
        let scoreMulti = 1.0;
        let revealedCount = 0;

        // VERIFIKASI TIKET
        function verifyTicket() {
            const input = document.getElementById('ticketInput').value.trim().toUpperCase();
            if (CONFIG.validTickets.includes(input)) {
                document.getElementById('ticketOverlay').style.display = 'none';
                initGame();
            } else {
                document.getElementById('ticketError').style.display = 'block';
            }
        }

        // INIT GAME
        function initGame() {
            const gridEl = document.getElementById('grid');
            const total = CONFIG.cols * CONFIG.rows;
            bombPositions = [];
            isGameOver = false;
            scoreMulti = 1.0;
            revealedCount = 0;

            gridEl.style.gridTemplateColumns = `repeat(${CONFIG.cols}, 60px)`;
            gridEl.innerHTML = '';

            while(bombPositions.length < CONFIG.bombs) {
                let r = Math.floor(Math.random() * total);
                if(!bombPositions.includes(r)) bombPositions.push(r);
            }

            for (let i = 0; i < total; i++) {
                const cell = document.createElement('div');
                cell.classList.add('cell');
                cell.onclick = () => handleTap(i, cell);
                gridEl.appendChild(cell);
            }
        }

        // LOGIKA KLIK
        function handleTap(idx, el) {
            if (isGameOver || el.classList.contains('open')) return;
            el.classList.add('open');
            
            if (bombPositions.includes(idx)) {
                // HASIL: GAGAL (Tampilkan tombol KEMBALI)
                isGameOver = true;
                el.innerText = '💣';
                el.classList.add('bomb');
                document.getElementById('status').innerText = "BOOM! Anda Gagal.";
                document.getElementById('btnLose').style.display = 'inline-block';
                revealAll();
            } else {
                // HASIL: BERHASIL (Tampilkan tombol KLAIM)
                revealedCount++;
                scoreMulti = Math.pow(CONFIG.profitRate, revealedCount);
                el.innerText = '💎';
                el.classList.add('safe');
                document.getElementById('multiDisplay').innerText = `x${scoreMulti.toFixed(2)}`;
                document.getElementById('status').innerText = "Berhasil! Tekan Klaim atau Lanjut.";
                
                // Munculkan tombol Klaim setiap kali berhasil menebak 
                // (Pemain bisa berhenti kapan saja untuk klaim)
                document.getElementById('btnWin').style.display = 'inline-block';
                document.getElementById('btnLose').style.display = 'none';
            }
        }

        function revealAll() {
            const cells = document.querySelectorAll('.cell');
            bombPositions.forEach(p => {
                cells[p].innerText = '💣';
                cells[p].classList.add('bomb');
            });
            // Sembunyikan tombol klaim jika ada karena sudah kalah
            document.getElementById('btnWin').style.display = 'none';
        }
    </script>
</body>
</html>
