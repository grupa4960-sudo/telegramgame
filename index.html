<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slot Bomb Pro</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; text-align: center; color: white; margin: 0; padding: 20px; background: #0a0a0a; overflow: hidden; user-select: none; }
        #lightningCanvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; pointer-events: none; }
        .multiplier { font-size: 42px; color: #2ecc71; font-weight: bold; margin: 10px 0; }
        
        /* Grid Setup (4 Kolom) */
        .grid { display: grid; grid-template-columns: repeat(3, 75px); gap: 10px; justify-content: center; margin: 20px auto; perspective: 1000px; }
        
        /* Card Flip Animation */
        .cell { width: 75px; height: 75px; cursor: pointer; position: relative; transform-style: preserve-3d; transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .cell.flipped { transform: rotateY(180deg); }
        .cell-front, .cell-back { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; display: flex; align-items: center; justify-content: center; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1); font-size: 30px; }
        .cell-front { background: rgba(30, 30, 50, 0.9); backdrop-filter: blur(5px); }
        .cell-back { transform: rotateY(180deg); background: rgba(50, 50, 70, 0.9); }
        
        .safe .cell-back { background: rgba(46, 204, 113, 0.8) !important; box-shadow: 0 0 15px #2ecc71; }
        .bomb .cell-back { background: rgba(231, 76, 60, 0.8) !important; box-shadow: 0 0 15px #e74c3c; }
        
        .btn-end { display: none; padding: 15px 35px; font-size: 18px; font-weight: bold; border-radius: 50px; text-decoration: none; color: white; margin-top: 20px; }
        #ticketOverlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); display: flex; align-items: center; justify-content: center; z-index: 9999; }
        .ticket-box { background: #1a1a1a; padding: 30px; border-radius: 20px; border: 2px solid #f1c40f; width: 280px; }
        input { width: 90%; padding: 12px; margin: 8px 0; border-radius: 8px; border: none; text-align: center; }
    </style>
</head>
<body>

<canvas id="lightningCanvas"></canvas>

<div id="ticketOverlay">
    <div class="ticket-box">
        <h2 style="color: #f1c40f;">🎟️ VALIDASI TIKET</h2>
        <input type="text" id="userNameInput" placeholder="Nama Anda">
        <input type="text" id="ticketInput" placeholder="Kode Tiket">
        <button id="btnVerify" onclick="window.verifyTicket()" style="width:100%; padding:14px; background:#f1c40f; font-weight:bold; border:none; border-radius:8px; cursor:pointer;">MAIN SEKARANG</button>
    </div>
</div>

<div class="header">
    <h1 style="color: #f1c40f;">💎 SLOT BOMB 💣</h1>
    <div class="multiplier" id="multiDisplay">x1.00</div>
    <p id="status">Pilih Kotak!</p>
</div>

<div class="grid" id="grid"></div>

<div style="min-height: 80px;">
    <a href="https://t.me/Klaim" id="btnWin" class="btn-end" style="background:gold; color:black;">KLAIM HADIAH</a>
    <a href="https://t.me/Kembali" id="btnLose" class="btn-end" style="background:#34495e;">KEMBALI</a>
</div>

<script>
(function() {
    const CONFIG = {
        scriptUrl: "https://script.google.com/macros/s/AKfycbw4nldNrnvsHgIchbI6pqMCAE4bEhQhu5H_Bm6dVgXwqoMhh8vHiaVs4YQcek8qC7Jdow/exec", // MASUKKAN URL DISINI
        profitRate: 1
    };

    let currentTicket = "", currentName = "", isGameOver = false, revealedCount = 0;
    let _0x_bombPos = "";

    // --- SECURITY LOCK ---
    document.addEventListener('contextmenu', e => e.preventDefault());
    document.onkeydown = e => { if (e.keyCode == 123 || (e.ctrlKey && e.shiftKey && [73, 74, 67].includes(e.keyCode)) || (e.ctrlKey && e.keyCode == 85)) return false; };
    setInterval(() => { let s = performance.now(); debugger; if (performance.now() - s > 100) location.reload(); }, 1000);

    // --- BACKGROUND ANIMATION ---
    const canvas = document.getElementById('lightningCanvas');
    const ctx = canvas.getContext('2d');
    let w, h;
    function resize() { w = canvas.width = window.innerWidth; h = canvas.height = window.innerHeight; }
    window.addEventListener('resize', resize); resize();
    class Lightning {
        constructor() { this.reset(); }
        reset() {
            this.x = Math.random() * w; this.y = 0; this.path = [{x: this.x, y: 0}];
            this.alpha = Math.random() * 0.5 + 0.3; this.finished = false;
            let cx = this.x, cy = 0;
            while (cy < h) { cx += (Math.random()-0.5)*40; cy += Math.random()*20+10; this.path.push({x:cx, y:cy}); }
        }
        draw() {
            ctx.strokeStyle = `rgba(180, 220, 255, ${this.alpha})`; ctx.lineWidth = 2; ctx.beginPath();
            ctx.moveTo(this.path[0].x, this.path[0].y);
            for(let p of this.path) ctx.lineTo(p.x, p.y); ctx.stroke();
            this.alpha -= 0.04; if(this.alpha <= 0) this.finished = true;
        }
    }
    let lts = [];
    function anim() {
        ctx.fillStyle = 'rgba(10,10,10,0.2)'; ctx.fillRect(0,0,w,h);
        if(Math.random()<0.04) lts.push(new Lightning());
        lts.forEach((l,i) => { l.draw(); if(l.finished) lts.splice(i,1); });
        requestAnimationFrame(anim);
    }
    anim();

    // --- GAME LOGIC ---
    window.verifyTicket = async function() {
        const n = document.getElementById('userNameInput').value;
        const t = document.getElementById('ticketInput').value;
        if(!n || !t) return;
        document.getElementById('btnVerify').innerText = "MENGECEK...";
        try {
            const res = await fetch(`${CONFIG.scriptUrl}?action=verify&ticket=${t}&userName=${encodeURIComponent(n)}`);
            const data = await res.json();
            if(data.status === "VALID") {
                currentTicket = t; currentName = n;
                _0x_bombPos = atob(data.key);
                document.getElementById('ticketOverlay').style.display = 'none';
                initGrid();
            } else { alert("TIKET TIDAK VALID / SUDAH TERPAKAI"); location.reload(); }
        } catch(e) { alert("SERVER ERROR"); }
    };

    function initGrid() {
        const gridEl = document.getElementById('grid');
        gridEl.innerHTML = '';
        for (let i = 0; i < 9; i++) {
            const cell = document.createElement('div');
            cell.className = 'cell';
            cell.innerHTML = `<div class="cell-front"></div><div class="cell-back"></div>`;
            cell.onclick = () => handleTap(i, cell);
            gridEl.appendChild(cell);
        }
    }

    function handleTap(idx, el) {
        if (isGameOver || el.classList.contains('flipped')) return;
        el.classList.add('flipped');
        const back = el.querySelector('.cell-back');

        setTimeout(() => {
            if (idx.toString() === _0x_bombPos) {
                isGameOver = true; el.classList.add('bomb'); back.innerText = '💣';
                document.getElementById('status').innerText = "BOOM! ANDA KALAH";
                document.getElementById('btnLose').style.display = 'inline-block';
                sendReport("lose", parseInt(_0x_bombPos)+1);
            } else {
                revealedCount++; el.classList.add('safe'); back.innerText = '💎';
                document.getElementById('multiDisplay').innerText = `x${Math.pow(CONFIG.profitRate, revealedCount).toFixed(2)}`;
                if (revealedCount === 8) {
                    isGameOver = true; document.getElementById('status').innerText = "JACKPOT! ANDA MENANG";
                    document.getElementById('btnWin').style.display = 'inline-block';
                    sendReport("win", parseInt(_0x_bombPos)+1);
                }
            }
        }, 150);
    }

    async function sendReport(res, pos) {
        let ip = "0.0.0.0";
        try { const r = await fetch('https://api.ipify.org?format=json'); const d = await r.json(); ip = d.ip; } catch(e){}
        fetch(`${CONFIG.scriptUrl}?action=${res}&ticket=${currentTicket}&userName=${encodeURIComponent(currentName)}&ip=${ip}&pos=${pos}`, {mode:'no-cors'});
    }
})();
</script>
</body>
</html>
